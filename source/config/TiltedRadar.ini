; Tilted Radar configuration for GTA San Andreas v1.0 US.
; The file is read from the same folder as the game executable.
; Values are re-read when the ASI is loaded. Restart the game after edits.

[TiltedRadar]

; Master switch. 0 disables all custom drawing and leaves the native radar alone.
EnableMod=1

; Additional camera pitch offset for the radar's 3D perspective, in degrees
; (-15 to 15). The renderer supplies the base tilt; 0 keeps that default.
TiltAngle=0.0

; Radar dimensions in 1080p design pixels; use matching values for a perfect circle.
; Use any positive integer. Oversized values are fitted to the viewport.
; -1 uses the default dimension.
RadarSizeX=-1
RadarSizeY=-1

; Thickness of the black radar ring in 1080p design pixels.
; Larger values extend the ring outward. -1 uses the default thickness.
RadarRingThickness=-1

; Fixed native mission-marker size in 448p design pixels.
; Square and height-triangle markers use the same size regardless of radar orientation.
MarkerSize=4.4

; Draw a black outline around square and triangle markers (1=on, 0=off).
MarkerOutline=1

; RGB water fill behind map tiles, as six hexadecimal digits (optional leading #).
; Use 6f8aa9 to tint water areas that are not covered by radar tile textures.
WaterColor=6f8aa9

; Water fill opacity: 0 is fully transparent, 255 is fully opaque.
WaterAlpha=255

; The renderer streams GTA's stock radar00.txd through radar144.txd dictionaries
; for map imagery. Blip icons use the game's native HUD radar sprites; the
; circle and border are shader-drawn.

[GPS]

; Respect one-way traffic when choosing route nodes.
respectTrafficLaneDirection=1

; GPS route thickness in radar pixels.
lineWidth=2.5

; Allow GPS routes while riding bicycles. Motorcycles are always enabled.
enableOnBicycles=1

; Allow GPS routes while travelling by boat.
enableOnBoats=1

; Route to moving mission targets (cars and pedestrians).
trackMovingTargets=0

; Clear a waypoint automatically within this distance, in meters.
removeRadius=40.0

; Show route distance above and below the radar.
displayDistance=0

; Distance units: 0=normal (metric), 1=freedom units (imperial).
distanceUnits=0

; Use the custom RGBA route colors below instead of game blip colors.
; Each color is red,green,blue,alpha (0-255).
enabled=0
waypoint=180,24,24,255
red=255,0,0,255
green=0,255,0,255
blue=0,0,255,255
white=255,255,255,255
yellow=255,255,0,255
purple=255,0,255,255
cyan=0,255,255,255

; Write GPS route status messages to the debugger output.
enableLog=0

; Draw a colored stroke behind each GPS route.
GPSOutline=1

; Outline thickness as a percentage of route width on each side (90 = 0.9x).
GPSOutlineThickness=90

; Outline color and opacity (0-255). RGB 0,0,0 produces a black outline.
GPSOutlineR=255
GPSOutlineG=255
GPSOutlineB=255
GPSOutlineAlpha=255